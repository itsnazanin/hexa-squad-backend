services:
  postgres:
    image: postgres:16

    container_name: course-platform-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: course_platform

    ports:
     - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgres/data

volumes:
  postgres_data:        